data:
  name: nq
  data_path: data/nq/parametric_relevance_tagged/validation.json
  
  max_query_length: 32
  max_seq_length: 256
  max_length: 3072
  use_single_context: True

  batch_size: 4
  seed: 42

model:
  model_name: meta-llama/Meta-Llama-3-8B-Instruct
  gen_kwargs:
    do_sample: False
    temperature: 1.0
    top_p: 1
    top_k: null
    max_new_tokens: 32

