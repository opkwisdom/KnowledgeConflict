  name: hotpotqa-w
  data_path: data/hotpotqa-w/retrieved/validation_1000r_top100.jsonl  

  max_query_length: 32
  max_seq_length: 256
  max_length: 3072
  use_single_context: False
  do_rerank: True

  topk_per_query: 10
  batch_size: 4
  seed: 42

  precompute_table_path: /workspaces/kvzip_nlplab/checkpoint/gen_emb_precompute_table/llama/nq_val_emb_precompute_table.h5
  score_mode: oracle  # emb_precompute use only oracle mode

model:
  model_name: meta-llama/Meta-Llama-3-8B-Instruct
  gen_kwargs:
    do_sample: False
    temperature: 1.0
    top_p: 1
    top_k: null
    max_new_tokens: 32

seed: 42

generate_prompt_name: base

output_dir: src/results/tests/disca
experiment_name: oracle_inference