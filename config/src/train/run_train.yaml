data:
  name: nq
  data_path: data/train/timeqa.json
  max_seq_length: 1024
  use_single_context: True

  batch_size: 4
  num_workers: 0
  topk_per_query: 10
  test_size: 0.1
  seed: 42

model:
  model_name: meta-llama/Llama-3-8B-Instruct
  gen_kwargs:
    do_sample: False
    temperature: 1.0
    top_p: 1
    top_k: null
    max_new_tokens: 32
  hidden_extraction_layers:
    - 20

caformer:
  model_name_or_path: roberta-base
  query_length: 8
  llm_width:    # Post initialized

  pooling_strategy: mean
  dropout: 0.1

train:
  learning_rate: 2e-5
  warmup_ratio: 0.01
  max_epochs: 3   # Test
  temperature:
  ctr_loss_weight: 0.0

  freeze_pretrained: True

seed: 42
debug_mode: False

self_task_prompt_name: base
generate_prompt_name: base
base_prompt_name: pure-llm-brief-2

output_dir: /workspaces/kvzip_nlplab/checkpoint
project_name: caformer
exp_type: single
