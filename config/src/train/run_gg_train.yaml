data:
  name: odqa
  data_path: data/train/odqa_train.jsonl
  
  max_seq_length: 256
  max_ans_length: 32

  batch_size: 1
  num_workers: 0
  topk_per_query: 10
  test_size: 0.05
  seed: 42

model:
  model_name: meta-llama/Meta-Llama-3-8B-Instruct
  gen_kwargs:
    do_sample: False
    temperature: 1.0
    top_p: 1
    top_k: null
    max_new_tokens: 32

caformer:
  model_name_or_path: roberta-base
  query_length: 32      # BLIP-2 default setting
  llm_width:    # Post initialized

  pooling_strategy: max
  dropout: 0.1

  use_linear_proj: True   # To embed as soft-prompt
  ckpt_path: /workspaces/kvzip_nlplab/checkpoint/stage2_recon_train/multi_LR=0.0001_fromST1_freeze=True/multi-epoch=00-step=010000-valid_nll_loss=2.0601.ckpt

train:
  learning_rate: 2e-5
  warmup_ratio: 0.05
  max_epochs: 2

  n_iter: 1   # the number of iterations for Taylor approximation
  oracle_mode: marginal
  max_interleaving_len:   # Post initialized
  freeze_pretrained: True

  scaling_factor: 10
  accumulate_grad_batches: 16
  append_question: True

seed: 42
debug_mode: False  # Only activate when debugging

self_task_prompt_name: base
generate_prompt_name: base
base_prompt_name: pure-llm-brief-2

output_dir: /workspaces/kvzip_nlplab/checkpoint
project_name: caformer
exp_type: multi
