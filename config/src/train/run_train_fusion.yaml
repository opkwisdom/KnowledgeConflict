    out_channels: 32
    n_layer: 32
    kernel_size: 5
  hidden_extractor:
    hidden_dim: 4096
    inter_dim: 512
    out_dim: 128
    dropout_rate: 0.5


project_name: conflict_detector
exp_type: fusion
output_dir: /workspaces/kvzip_nlplab/KFC-dev/src/trained_model