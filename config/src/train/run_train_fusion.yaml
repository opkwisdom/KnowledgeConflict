data:
  filepath: /workspaces/kvzip_nlplab/KFC/data/combined_train_data/train_features_label5_all.pt
  batch_size: 256
  num_workers: 4

train:
  learning_rate: 3e-5
  warmup_ratio: 0.1
  max_epochs: 50
  n_class: 5

model:
  n_class: 5
  feature_extractor:
    n_heads: 8
    n_features: 3
