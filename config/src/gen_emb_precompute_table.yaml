data:
  # name: odqa
  # data_path: data/train/odqa_train_top100.jsonl
  name: nq
  data_path: data/nq/retrieved/validation_top100.jsonl
  
  max_seq_length: 256
  max_ans_length: 32

  batch_size: 1
  num_workers: 8
  topk_per_query: 10
  test_size: 0.05
  seed: 42

  use_precompute_table: False
