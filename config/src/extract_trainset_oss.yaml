data:
  name: nq
  data_path: data/train/raw_pj.jsonl
  max_seq_length: 1024
  use_single_context: True

  batch_size: 32
  seed: 42

llm_judger:
  llm_model_name: openai/gpt-oss-120b
  prompt_name: judge_few_shot_anchor_v2
  seed: 42
  # vllm sampling params
  sampling_params:
    temperature: 0.0
    top_p: 1.0
    max_tokens: 4096
    presence_penalty: 0.0
    frequency_penalty: 0.0
    logprobs: 
    prompt_logprobs:
    stop: ["<|return|>", "<|call|>", "<|end|>", "<|message|>"]
  use_cache: True
  cache_dir: src/cache_dir

seed: 42

output_dir: src/results/extract_trainset_hf
project_name: judger
