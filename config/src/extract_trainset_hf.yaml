data:
  name: nq
  data_path: data/train/raw_pj.jsonl
  max_seq_length: 1024
  use_single_context: True

  batch_size: 16
  seed: 42

llm_judger:
  # llm_model_name: meta-llama/Llama-3.1-8B-Instruct
  llm_model_name: RedHatAI/Meta-Llama-3.1-70B-Instruct-FP8
  do_quant: True
  # do_quant: False
  prompt_name: judge_few_shot_anchor_v2
  seed: 42
  # vllm sampling params
  sampling_params:
    temperature: 0.0
    top_p: 1.0
    max_tokens: 1024
    presence_penalty: 0.0
    frequency_penalty: 0.0
    logprobs: 
    prompt_logprobs:
    stop: ["<|eot_id|>", "<|end_of_text|>"]
  use_openai: False
  use_vllm: True
  use_cache: True
  cache_dir: src/cache_dir

seed: 42

output_dir: src/results/extract_trainset_hf
project_name: judger
