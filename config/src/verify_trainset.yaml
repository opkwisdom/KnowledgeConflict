data:
  name: nq
  data_path: data/combined_train_data/sampled_train_data.jsonl
  max_seq_length: 1024
  use_single_context: True

model:
  model_name: meta-llama/Llama-3.1-8B-Instruct
  gen_kwargs:
    do_sample: False
    temperature: 1.0
    top_p: 1
    top_k: null
    max_new_tokens: 32
  return_probs: False  # Uncentainty
  ### Pruning options
  prune:
    ratio: 0.3
  ### Filter irrelevant contexts
  conflict_topk: 100
  control_metadata:
    stats_path: experiments/cache_stats/kv_cache_control_stats.json
    layer_info_path: experiments/cache_stats/conflict_layer_info.json

self_task_prompt_name: base
generate_prompt_name: base
output_dir: src/results/main/verify
task: base
experiment_name: